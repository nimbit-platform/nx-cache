name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # GitHub Packages for this repository (Container registry).
  # https://github.com/nimbit-platform/nx-cache/pkgs/container/nx-cache
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: publish
        name: Decide whether to publish
        run: |
          push=false
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            push=true
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            # Same-repo PRs: publish sha tags so the package appears on this repo.
            # Fork PRs never push.
            push=true
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.publish.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
            org.opencontainers.image.title=nx-cache
            org.opencontainers.image.description=Self-hosted Nx remote cache
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GitHub Package public
        if: steps.publish.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Public packages are free. Linked packages inherit repo visibility;
          # this call makes it explicit if the registry still created it private.
          name="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          owner="${GITHUB_REPOSITORY_OWNER}"
          for i in 1 2 3 4 5 6; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${name}/visibility" \
              -f visibility=public; then
              echo "Package ghcr.io/${owner}/${name} is public"
              exit 0
            fi
            echo "visibility not set yet (attempt ${i}); waiting for package index"
            sleep 5
          done
          echo "Could not set visibility via API; check Packages UI if the image is private"
          exit 0
